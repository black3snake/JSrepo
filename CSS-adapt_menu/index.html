<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Navigation</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.0-2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="menu">
      <div class="menu-wrap">
        <img src="logo.png" class="logo-img" alt="Logo" />
        <input type="checkbox" id="checkbox" onclick="validateCheckbox(this)" />
        <nav>
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
        <label for="checkbox">
          <i class="fa fa-bars menu-icon"></i>
        </label>
      </div>
    </header>
    <section>
      <div class="wrapper">
        <h1>An Awesome Title Here</h1>
        <p>
          This tutorial will guide you through creating a responsive dropdown
          navigation using CSS only, with the help of flexbox and the
          "checkbox-hack".
        </p>
      </div>
    </section>
    <script>
      function validateCheckbox(checkbox) {
        var container = document.getElementsByClassName('wrapper')[0]
        // const mar200 = 200
        // console.log(checkbox.checked)
        if (checkbox.checked) {
          // Действия, если флажок установлен
          // console.log(container)
          container.style.marginTop = '200px'
          //   container.style.color = 'red'
        } else {
          // Действия, если флажок не установлен
          container.style.marginTop = '0px'
        }
      }
    </script>
    <script>
      window.addEventListener('resize', (e) => {
        // console.log(document.body.clientWidth)
        const marginT =
          document.getElementsByClassName('wrapper')[0].style.marginTop
        if (document.body.clientWidth > 768 && marginT == '200px') {
          document.getElementsByClassName('wrapper')[0].style.marginTop = '0px'
          // console.log('>768 ' + marginT)
        } else if (
          document.body.clientWidth < 768 &&
          marginT == '0px' &&
          checkbox.checked
        ) {
          document.getElementsByClassName('wrapper')[0].style.marginTop =
            '200px'
          // console.log('<768 ' + marginT)
        }
        // console.log('final: ' + marginT)
      })
    </script>
  </body>
</html>
